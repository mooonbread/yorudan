<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#243c40">
    <meta name="description" content="@yorudan — storyteller, songwriter, formgiver.">
    <title>@yorudan — storyteller | songwriter | formgiver</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="slideshow.js"></script>
  </head>
  <body>
    <main class="hero">
      <div class="hero__backgrounds">
        <img class="hero__photo is-visible" src="assets/20210603_111514.jpg"
          alt="Yorudan taking a selfie above a green mountain valley beneath a wide, cloud-filled sky."
          width="2048" height="1536" fetchpriority="high">
        <img class="hero__photo" alt="" aria-hidden="true" decoding="async">
      </div>
      <div class="hero__shade" aria-hidden="true"></div>
      <div class="identity">
        <h1 aria-label="@yorudan"><img class="wordmark" src="assets/yorudan-wordmark.svg" alt="" width="670" height="189"></h1>
        <nav aria-label="Explore my work">
          <a href="https://open.spotify.com/episode/7y5giOT1I2t5vtQo8OwY29">storyteller</a>
          <span aria-hidden="true">|</span>
          <a href="https://yorudan.bandcamp.com">songwriter</a>
          <span aria-hidden="true">|</span>
          <a href="https://mooonbread.com">formgiver</a>
        </nav>
      </div>
      <button class="rotation-toggle" type="button" hidden aria-label="Pause background slideshow">
        <svg class="pause-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m8 5 11 7-11 7z" fill="currentColor"/></svg>
      </button>
    </main>
  </body>
